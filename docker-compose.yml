services:
  # ==========================================
  # Backend FastAPI
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sennova-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://${DB_USER:-sennova}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-sennova}}"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${DB_USER:-sennova}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-sennova}
      # Security
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET con minimo 32 caracteres generado con secrets.token_urlsafe(48)}"
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # Administrador inicial: unico dato de negocio obligatorio en el primer
      # despliegue. Sin contrasena el arranque falla a proposito.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@sena.edu.co}
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?Define INITIAL_ADMIN_PASSWORD con minimo 12 caracteres}"
      INITIAL_ADMIN_NOMBRE: "${INITIAL_ADMIN_NOMBRE:-Administrador SENNOVA}"
      INITIAL_ADMIN_DOCUMENTO: "${INITIAL_ADMIN_DOCUMENTO:-admin01}"
      INITIAL_ADMIN_SEDE: "${INITIAL_ADMIN_SEDE:-CGAO}"
      # Poblado de demostracion: destructivo, solo se ejecuta con DEBUG=true.
      SEED_INITIAL_DATA: "${SEED_INITIAL_DATA:-false}"
      # Storage & Uploads
      STORAGE_DIR: "${STORAGE_DIR:-/app/storage}"
      # App Config
      APP_NAME: ${APP_NAME:-SENNOVA CGAO API}
      DEBUG: "${DEBUG:-false}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # CORS
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://sennova.enlinea.sbs}"
      ADDITIONAL_CORS_ORIGINS: "${ADDITIONAL_CORS_ORIGINS:-}"
      # Public URLs
      FRONTEND_URL: "${FRONTEND_URL:-https://sennova.enlinea.sbs}"
      BACKEND_URL: "${BACKEND_URL:-https://sennova.enlinea.sbs/api}"
      # External Integrations
      CVLAC_BASE_URL: ${CVLAC_BASE_URL:-https://scienti.minciencias.gov.co}
      HOST: ${HOST:-0.0.0.0}
      PORT: "${PORT:-8000}"
      # Redis (optional)
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: "${REDIS_PORT:-6380}"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "${REDIS_DB:-0}"
      # SMTP (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@sena.edu.co}
      SMTP_TLS: "${SMTP_TLS:-true}"
    expose:
      - ${PORT:-8000}
    volumes:
      - sennova_storage:/app/storage # Persistencia de documentos
      - ./backend/sennova.db:/app/sennova.db # Persistencia de base de datos SQLite (si se usa)
    networks:
      - coolify
    # Healthcheck usa variable PORT para ser consistente con la configuración
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://localhost:${PORT:-8000}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Frontend React
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En producción con proxy nginx usamos la ruta relativa /api;
        # nginx redirige /api → http://backend:8000 (comunicación interna).
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_CVLAC_BASE_URL=${VITE_CVLAC_BASE_URL:-https://scienti.minciencias.gov.co}
    container_name: sennova-frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      # Variables en runtime para referencia (build ya está hecho)
      - API_URL=/api
      - BACKEND_INTERNAL_URL=http://backend:8000
    networks:
      - coolify
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==========================================
# Volúmenes
# ==========================================
volumes:
  sennova_storage:
    driver: local

# ==========================================
# Redes
# ==========================================
networks:
  coolify:
    external: true
