# ==========================================
# SENNOVA CGAO - Coolify Configuration v4
# Archivo de configuración para Coolify v4+
# ==========================================

# Información del proyecto
name: sennova-cgao
version: 2.0.0
description: Sistema de Gestión de Proyectos de Investigación SENNOVA CGAO

# Tipo de servicio
type: docker-compose

# Servicios
docker_compose_file: docker-compose.yml

# Variables de entorno requeridas
environment:
  required:
    - DB_PASSWORD
    - JWT_SECRET
    - INITIAL_ADMIN_PASSWORD

# Volúmenes persistentes (se configuran automáticamente en Coolify)
persistent_volumes:
  - pg_data
  - storage_data
  - uploads_data
  - backups_data

# Healthchecks
healthchecks:
  backend:
    path: /health
    port: 8000
  frontend:
    path: /
    port: 80

# Notas para el administrador
notes: |
  Este proyecto incluye:
  - PostgreSQL 16 con copias de seguridad automáticas cada 24 horas
  - Backend FastAPI con healthcheck
  - Frontend React con Nginx
  - Volúmenes persistentes para datos y archivos
  
  Variables obligatorias:
  1. DB_PASSWORD: contraseña fuerte para PostgreSQL
  2. JWT_SECRET: valor aleatorio de mínimo 32 caracteres
  3. INITIAL_ADMIN_PASSWORD: contraseña para crear el administrador inicial

  Las demás opciones usan valores predeterminados. El frontend consume /api
  mediante el proxy interno de Nginx.
