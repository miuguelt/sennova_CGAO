name: DevBrain DevSecOps - Security & Code Integrity

on:
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret Leak Detection (Anti-leak Policy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Frontend Dependency Audit
        working-directory: ./frontend
        run: |
          echo "Auditando paquetes npm de producción..."
          npm audit --omit=dev --audit-level=critical || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend Dependency Audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          echo "Auditando vulnerabilidades conocidas en paquetes Python..."
          pip-audit -r backend/requirements.txt || true
