# ════════════════════════════════════════════════════════════════════════
# SENNOVA CGAO — Docker Compose PRODUCCIÓN (Coolify / Contabo VPS)
# ════════════════════════════════════════════════════════════════════════
#
# Diseño:
#   Frontend  → Nginx (puerto interno 80)
#   Backend   → Uvicorn + FastAPI (puerto interno 8000)
#   DB        → PostgreSQL 16 (reemplaza MySQL, menor RAM en VPS barato)
#
# En Coolify:
#   1. Importar este archivo como "Docker Compose" en tu proyecto.
#   2. Configurar las variables de entorno en la UI de Coolify.
#   3. Habilitar el dominio HTTPS desde el panel de Coolify (Traefik).
#   4. Click "Deploy".
#
# Prerequisito único: el VPS debe tener Docker + Docker Compose instalado.
# ════════════════════════════════════════════════════════════════════════

services:

  # ── FRONTEND (Nginx + SPA Build) ──────────────────────────────────────
  sennova-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
    image: sennova-frontend:${APP_VERSION:-latest}
    container_name: sennova_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      sennova-backend:
        condition: service_healthy
    networks:
      - sennova-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      coolify.managed: "true"

  # ── BACKEND (FastAPI + Uvicorn) ────────────────────────────────────────
  sennova-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sennova-backend:${APP_VERSION:-latest}
    container_name: sennova_backend
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-2}
      --log-level warning
    expose:
      - "8000"
    environment:
      # ── App ──
      APP_ENV: production
      APP_NAME: ${APP_NAME:-SENNOVA CGAO API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEBUG: "false"
      # ── Base de Datos (PostgreSQL) ──
      DB_HOST: ${DB_HOST:-sennova-db}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${DB_USER:-sennova}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-sennova}
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://${DB_USER:-sennova}:${DB_PASSWORD}@sennova-db:5432/${DB_NAME:-sennova}}"
      # ── Seguridad ──
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # ── CORS ──
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://${DOMAIN:-localhost},https://www.${DOMAIN:-localhost}}"
      ADDITIONAL_CORS_ORIGINS: "${ADDITIONAL_CORS_ORIGINS:-}"
      # ── URLs Públicas ──
      FRONTEND_URL: "${FRONTEND_URL:-https://${DOMAIN:-localhost}}"
      BACKEND_URL: "${BACKEND_URL:-https://${DOMAIN:-localhost}/api}"
      # ── Admin Inicial ──
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@sena.edu.co}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-123456}
      # ── CVLAC ──
      CVLAC_BASE_URL: ${CVLAC_BASE_URL:-https://scienti.minciencias.gov.co}
      # ── Redis (Caché & Real-time) ──
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: "${REDIS_PORT:-6380}"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "${REDIS_DB:-0}"
      # ── SMTP (Opcional) ──
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@sena.edu.co}
      SMTP_TLS: "${SMTP_TLS:-true}"
      # ── Observabilidad ──
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - storage_data:/app/storage
      - uploads_data:/app/uploads
    depends_on:
      sennova-db:
        condition: service_healthy
    networks:
      sennova-net:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ── DB INITIALIZER (corre y muere — idempotente) ───────────────────────
  sennova-db-init:
    image: sennova-backend:${APP_VERSION:-latest}
    container_name: sennova_db_init
    restart: "no"
    command: >
      sh -c "
        echo '🔄 Esperando base de datos...' &&
        sleep 5 &&
        echo '🔧 Ejecutando migraciones...' &&
        alembic upgrade head &&
        echo '✅ Inicialización completa.'
      "
    environment:
      APP_ENV: production
      DB_HOST: ${DB_HOST:-sennova-db}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${DB_USER:-sennova}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-sennova}
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://${DB_USER:-sennova}:${DB_PASSWORD}@sennova-db:5432/${DB_NAME:-sennova}}"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sennova-db:
        condition: service_healthy
    networks:
      - sennova-net

  # ── POSTGRESQL 16 ──────────────────────────────────────────────────────
  sennova-db:
    image: postgres:16-alpine
    container_name: sennova_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sennova}
      POSTGRES_USER: ${DB_USER:-sennova}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=es_CO.UTF-8 --encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=50
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sennova-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sennova} -d ${DB_NAME:-sennova}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── BACKUP (pg_dump diario) ────────────────────────────────────────────
  sennova-backup:
    image: postgres:16-alpine
    container_name: sennova_backup
    restart: unless-stopped
    entrypoint: >
      sh -c "
        while true; do
          BACKUP_FILE=/backups/sennova_$$(date +%Y%m%d_%H%M%S).sql.gz
          echo \"[backup] Iniciando dump: $$BACKUP_FILE\"
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h sennova-db -U $$POSTGRES_USER $$POSTGRES_DB | gzip > $$BACKUP_FILE &&
          echo \"[backup] ✅ Dump completo.\" ||
          echo \"[backup] ❌ Error al hacer dump.\"
          ls -t /backups/*.sql.gz 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null || true
          echo \"[backup] Próximo backup en 24h...\"
          sleep 86400
        done
      "
    environment:
      POSTGRES_USER: ${DB_USER:-sennova}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-sennova}
    volumes:
      - ./backups:/backups
    depends_on:
      sennova-db:
        condition: service_healthy
    networks:
      - sennova-net

# ── REDES ──────────────────────────────────────────────────────────────
networks:
  sennova-net:
    driver: bridge
    internal: false

# ── VOLÚMENES PERSISTENTES ────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  storage_data:
    driver: local
  uploads_data:
    driver: local
